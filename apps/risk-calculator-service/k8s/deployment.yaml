apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-calculator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-calculator-service
  template:
    metadata:
      labels:
        app: risk-calculator-service
    spec:
      containers:
        - name: risk-calculator-service
          image: risk-calculator-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap.kafka.svc:9092"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
