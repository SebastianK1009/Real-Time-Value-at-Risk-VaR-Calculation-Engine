apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "risk-calculator-service.fullname" . }}
  labels:
    {{- include "risk-calculator-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "risk-calculator-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "risk-calculator-service.selectorLabels" . | nindent 8 }}
        app: {{ include "risk-calculator-service.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.env.dbUser | quote }}
            - name: DB_PASS
              value: {{ .Values.env.dbPass | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
