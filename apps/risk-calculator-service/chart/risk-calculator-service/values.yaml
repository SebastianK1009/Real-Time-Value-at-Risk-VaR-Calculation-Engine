replicaCount: 1

image:
  repository: risk-calculator-service
  pullPolicy: IfNotPresent
  tag: "latest"

kafka:
  bootstrapServers: "kafka-cluster.kafka.svc:9092"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
