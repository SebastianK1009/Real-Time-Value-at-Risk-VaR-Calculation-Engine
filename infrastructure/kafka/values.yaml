# Bitnami Kafka Chart Configuration
# using KRaft mode (no ZooKeeper)

global:
  security:
    allowInsecureImages: true

# Use AWS ECR Public mirror to avoid Docker Hub rate limits and 404s
image:
  registry: public.ecr.aws
  repository: bitnami/kafka
  tag: "3.7"
  pullPolicy: Always

# Single Controller/Broker node for Low Resource / Dev environment
controller:
  replicaCount: 1 # Runs only 1 Kafk broker pod, but low availability
  
  # Minimal Resources
  # resources: defined below


  # Reduced JVM Heap settings
  # Kafka runs on Java. Adjusting heap size helps fit into low memory.
  heapOpts: "-Xmx512m -Xms512m" # Increased to 512m
  
  persistence:
    enabled: true
    storageClass: "gp2"
    size: 10Gi
  
  # Fix for permission issues on AWS EBS volumes
  volumePermissions:
    enabled: true

  resources:
    limits:
      memory: 1Gi  # Increased to 1Gi
    requests:
      memory: 512Mi
      cpu: 100m

# KRaft settings
kraft:
  enabled: true

auth:
  clientProtocol: PLAINTEXT
  interBrokerProtocol: PLAINTEXT
  sasl:
    enabled: false

listeners:
  client:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT


# Disable ZooKeeper
# This saves money and resources, as you don't need a separate cluster just to manage metadata of Kafka.
zookeeper:
  enabled: false



# Extra Environment Variables
# Necessary for single-node cluster to function correctly without 3 replicas
extraEnvVars:
  - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
    value: "1"

# Force configuration via server.properties override
extraConfig: |
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1

